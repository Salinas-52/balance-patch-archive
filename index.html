<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>밸런스 패치 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#1C1C1E; --ink2:#4C4C50; --mute:#9A9AA0; --faint:#C6C6CB;
  --line:#E3E3E7; --line2:#EFEFF1; --bg:#F4F4F6; --panel:#FAFAFB; --red:#E5202D;
  --side:236px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  font-size:15px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.025em}
p{margin:0}
a{color:inherit;text-decoration:none}

.sheet{max-width:1280px;margin:0 auto;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}

/* 마스트헤드 */
.mast{padding:36px 56px 26px;background:var(--ink);color:#fff}
.mast h1{font-size:28px;color:#fff}
.mast h1 .hsub{color:#9A9AA0}
.mast .desc{margin-top:6px;font-size:14px;color:#9A9AA0}
.mastmeta{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid rgba(255,255,255,.16);color:#9A9AA0}
.mastmeta div{padding:11px 0 0 20px;border-left:1px solid rgba(255,255,255,.16)}
.mastmeta div:first-child{padding-left:0;border-left:0}
.mastmeta .lb{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;color:#8E8E96;margin-bottom:3px}
.mastmeta .v{font-size:15px;color:#fff}
.mastmeta .v b{font-weight:800}

/* 상단 내비 버튼 */
.topnav{display:flex;flex-wrap:wrap;gap:12px;padding:18px 48px;border-bottom:1px solid var(--line);background:#fff}
.tbtn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 24px;border-radius:10px;font-size:16.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.tbtn svg{flex:none}
.tbtn.search{min-width:240px;background:var(--red);color:#fff;border:1px solid var(--red)}
.tbtn.search:hover{background:#cf1b27;border-color:#cf1b27}
.tbtn.search:not(.on){background:#fff;color:var(--red)}
.tbtn.search:not(.on):hover{background:#FDECEC}
.tbtn.arch{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tbtn.arch:hover{border-color:var(--ink)}
.tbtn.arch.open{background:var(--ink);border-color:var(--ink);color:#fff}
.tbtn.arch .cnt{font-size:13px;font-weight:700;color:var(--mute)}
.tbtn.arch.open .cnt{color:#9C9CA2}
.tbtn.arch .chev{transition:transform .2s}
.tbtn.arch.open .chev{transform:rotate(180deg)}

/* 본문: 아카이브를 펼쳤을 때만 사이드 노출 */
.layout{display:block}
.layout.open{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side[hidden]{display:none}
.side{border-right:1px solid var(--line);position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:14px 0 40px}
.side .sh{padding:0 22px;margin:20px 0 6px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.side .sh:first-child{margin-top:0}
.nav{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;
  padding:9px 22px 9px 20px;border-left:2px solid transparent;font-size:14.5px;font-weight:700;color:var(--mute);text-align:left}
.nav .c{font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.nav:hover{color:var(--ink2);background:#FBFBFC}
.nav.on{border-left-color:var(--red);color:var(--ink);background:#FBFBFC}
.nav.on .c{color:var(--red)}
.yr{padding:0 22px;margin:18px 0 4px;font-size:12.5px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:10px}
.yr:after{content:"";flex:1;height:1px;background:var(--line2)}

.main{min-width:0;padding-bottom:80px}
.pad{padding:0 48px}
.view{display:none}.view.on{display:block}

/* 헤더 */
.rhead{padding:42px 48px 0}
.rtitle{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.rtitle h2{font-size:27px}
.rmeta{font-size:13px;color:var(--mute)}
.rmeta b{color:var(--ink);font-weight:700}
.lead{margin-top:14px;font-size:15px;line-height:1.8;color:var(--ink2)}

/* 블록 */
.block{margin:26px 48px 0;padding:22px 26px 24px;background:var(--panel);border:1px solid var(--line2);border-radius:10px}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:14px}
.btitle{font-size:18px;font-weight:800;letter-spacing:-.025em;white-space:nowrap}
.btitle:before{content:"";display:inline-block;width:7px;height:7px;background:var(--red);margin-right:10px;vertical-align:.18em}
.bnote{font-size:12.5px;color:var(--mute)}

/* 검색 폼 */
.form{display:grid;grid-template-columns:auto 1fr;gap:14px 18px;align-items:center}
.form .lb{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill .c{margin-left:5px;font-size:12px;font-weight:700;color:var(--faint)}
.pill.on .c{color:#9C9CA2}
.q{width:100%;max-width:440px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15.5px;font-weight:600;outline:0}
.q:focus{border-color:var(--ink)}
.q::placeholder{color:var(--faint);font-weight:500}
.hint{grid-column:2;margin-top:-4px;font-size:13px;color:var(--mute);min-height:20px}
.hint b{color:var(--ink);font-weight:700}

/* 결과 목록 */
.rows{margin-top:6px}
.row{display:grid;gap:0 20px;padding:16px 0;border-bottom:1px solid var(--line2);align-items:start}
.row:last-child{border-bottom:0}
.row.has-date{grid-template-columns:96px 170px 120px 170px minmax(0,1fr)}
.row.no-date{grid-template-columns:170px 120px 170px minmax(0,1fr)}
.row.rh{padding:0 0 9px;border-bottom:1px solid var(--ink);font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.01em}
.row:not(.rh):hover{background:#FBFBFC}
.cell .mob{display:none}
.dt{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.dt a{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--mute);border-bottom:1px solid transparent;width:fit-content}
.dt a:hover{color:var(--red);border-bottom-color:var(--red)}
.mn{font-size:15px;font-weight:800;line-height:1.45;letter-spacing:-.02em}
.mn .l2{display:block;margin-top:2px;font-size:13px;font-weight:600;color:var(--mute)}
.attrs{display:flex;flex-wrap:wrap;gap:4px}
.at{display:inline-block;padding:1px 8px;border-radius:5px;font-size:12.5px;font-weight:800;line-height:1.7;letter-spacing:0}
.at.물{background:#E8F1FD;color:#2563C9}
.at.불{background:#FDECEC;color:#D42323}
.at.바람{background:#FFF3D6;color:#A87100}
.at.빛{background:#DDF6EF;color:#0F8F78}
.at.어둠{background:#EEE9FB;color:#6A3FD0}
.at.전속성{background:var(--ink);color:#fff}
.at.전체{background:#EFEFF1;color:var(--ink2)}
.at.etc{background:#EFEFF1;color:var(--mute);font-weight:700}
.sk{font-size:14px;font-weight:700;line-height:1.5;color:var(--ink)}
.sk span{display:block}
.sk .none,.none{color:var(--faint);font-weight:500}
.tx{font-size:14px;line-height:1.75;color:#63636A;white-space:pre-wrap}
.tx .tag{display:inline-block;margin-right:6px;padding:0 7px;border-radius:4px;background:#F1F1F3;font-size:12px;font-weight:800;line-height:1.7;color:var(--ink2);white-space:nowrap}
.tx .ar{color:var(--red);font-weight:800}
mark{background:#FFE9EA;color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:34px 0 10px;text-align:center;color:var(--mute);font-size:14.5px}
.empty b{color:var(--ink)}

/* 월별 탭: 섹션 */
.secpills{position:sticky;top:0;z-index:20;background:#fff;display:flex;flex-wrap:wrap;gap:8px;margin:34px 0 0;padding:9px 48px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.secs{padding:0 48px}
.sec{padding-top:36px;scroll-margin-top:70px}
.sec+.sec{border-top:1px solid var(--line);margin-top:36px}
.sechead{display:flex;align-items:baseline;gap:11px;padding-bottom:6px}
.sechead .mark{width:4px;height:24px;background:var(--red);align-self:center;flex:none}
.sechead h3{font-size:22px}
.secmeta{font-size:12.5px;color:var(--mute)}
.gband{margin:34px 48px 0;padding:10px 16px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;font-size:15px;font-weight:800}

.foot{margin:60px 48px 0;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}

/* 모바일: 사이드 -> 상단 가로 탭 */
@media (max-width:900px){
  .mast{padding:34px 20px 28px}.mast h1{font-size:25px}
  .mastmeta{grid-template-columns:1fr 1fr 1fr}.mastmeta div{padding-left:12px}.mastmeta .v{font-size:13.5px}
  .topnav{padding:14px;gap:8px}.tbtn{height:50px;padding:0 16px;font-size:15px;flex:1 1 auto;justify-content:center}.tbtn.search{min-width:0}
  .layout.open{display:block}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:6px 0 14px}
  .side .yr{margin-top:12px}
  .rhead{padding:30px 20px 0}.rtitle h2{font-size:23px}
  .block{margin:20px 14px 0;padding:18px 16px 18px}
  .gband{margin:26px 14px 0}
  .secpills{top:0;padding:9px 14px}.secs{padding:0 14px}
  .form{grid-template-columns:1fr;gap:8px}.hint{grid-column:1;margin-top:0}
  .row.rh{display:none}
  .row.has-date,.row.no-date{grid-template-columns:1fr;gap:6px;padding:16px 0}
  .cell .mob{display:inline;font-size:11px;font-weight:700;color:var(--mute);margin-right:8px;letter-spacing:.04em}
  .foot{margin:40px 20px 0}
}
</style>
</head>
<body>
<div class="sheet">

    </main>

</div>

,"t":"【수치 변경】 아군이 약화효과에 걸릴 때마다 약화효과에 걸린 아군의 공격 게이지가 10%씩 최대 30%에서 → 20%씩 최대 60%까지 증가합니다.","src":"2025.3!15"},{"d":"2025.03.30","m":"인드라","a":"불","k":"체인 이펙트(패시브)","t":"【효과 추가】 뇌신 상태일 때, 자신의 턴에서 공격 시 적 대상의 공격 게이지를 15%씩 감소시킵니다.","src":"2025.3!16"},{"d":"2025.03.30","m":"후시구로 메구미\n 퇴마협회 소환술사","a":"불","k":"주술사의 긍지(패시브)\n 퇴마사의 긍지(패시브)","t":"【스킬 효과 변경 및 수치 변경】\n 자신이 적을 공격할 때 적의 강화 효과를 1개 제거합니다 → 자신이 적을 공격할 때 적의 강화 효과 1개 빼앗아옵니다.\n 자신을 제외한 아군이 공격을 받으면 자신의 공격 게이지가 20% → 30% 증가합니다.","src":"2025.3!17"},{"d":"2025.03.30","m":"후시구로 메구미\n 퇴마협회 소환술사","a":"바람","k":"그림자 응용술식\n 잠재력 해방","t":"【효과 추가】 아군 모두에게 1턴간 면역효과를 부여합니다.","src":"2025.3!18"},{"d":"2025.03.30","m":"후시구로 메구미\n 퇴마협회 소환술사","a":"물/바람/빛","k":"불지정저\n 하늘 개구리","t":"최대 쿨타임이 1턴 감소됩니다. (4턴 → 3턴)","src":"2025.3!19"},{"d":"2025.03.30","m":"쿠기사키 노바라\n 퇴마협회 헌터","a":"바람","k":"강한 정신력(패시브)\n 강한 복수심(패시브)","t":"【수치 변경】 자신에게 약화효과가 걸려있으면 자신의 체력이 5% → 10% 감소, 보스를 제외한 적 모두의 체력이 15% → 25%씩 감소되도록 변경됩니다.","src":"2025.3!20"},{"d":"2025.03.30","m":"쿠기사키 노바라\n 퇴마협회 헌터","a":"빛","k":"추령주법 공명\n 퇴마술법 공명","t":"【효과 추가】 1턴 간 도발효과를 부여합니다.","src":"2025.3!21"},{"d":"2025.03.30","m":"해왕","a":"불/어둠","k":"멸망의 창","t":"【스킬 효과 변경】\n (기존) 1타 : 강화 효과 2개 제거, 2타 : 스킬 쿨타임 최대에서\n → (변경) 강화 효과 1개 제거 후, 쿨타임 최대가 2타 모두 적용되도록 변경됩니다.","src":"2025.3!22"},{"d":"2025.03.30","m":"피닉스","a":"불","k":"영원불멸(패시브)","t":"최대 쿨타임이 2턴 감소됩니다. (12턴 → 10턴)","src":"2025.3!23"},{"d":"2025.03.30","m":"예니퍼\n 마법교단 요술사","a":"물","k":"일렉트릭 볼\n 크로우 필드","t":"【효과 추가】 적에게 걸린 약화효과 하나당 내 공격 게이지가 15%씩 증가합니다.","src":"2025.3!24"},{"d":"2025.03.30","m":"드라칸 전사","a":"물","k":"드래곤 스트라이크","t":"【스킬 효과 변경】\n 2턴간 빗맞음 발생 확률 증가 → 공격 게이지 30% 감소 효과로 변경됩니다.","src":"2025.3!25"},{"d":"2025.03.30","m":"드라칸 전사","a":"빛","k":"용의 비늘(패시브)","t":"【효과 추가】 자신이 약화 효과에 걸릴때마다 방어력이 2턴 간 증가합니다.","src":"2025.3!26"},{"d":"2025.03.30","m":"토템술사","a":"어둠","k":"반달 부족의 토템","t":"【수치 변경】 50% 확률로 2턴간 도발 → 70% 확률로 2턴간 도발로 변경됩니다.","src":"2025.3!27"},{"d":"2025.03.30","m":"선인","a":"바람","k":"윤회의 번개","t":"【스킬 효과 변경】\n (기존) 첫 공격으로 죽은 적 대상 부활불가\n → (변경) 공격 게이지를 50% 감소시킵니다. ","src":"2024.9!35"}]},{"name":"스킬 오류 수정","rows":[{"d":"2024.09.30","m":"슬레이어","a":"바람","k":"종말의 대검","t":"스킬 사용 후, 몬스터가 부자연스럽게 보이던 오류가 수정되었습니다.","src":"2024.9!38"},{"d":"2024.09.30","m":"쿠기사키 노바라","a":"빛","k":"추령주법 공명","t":"스킬 사용 시, 흡혈 효과가 적용되던 오류가 수정되었습니다.","src":"2024.9!39"},{"d":"2024.09.30","m":"요정왕","a":"어둠","k":"통찰(패시브)","t":"약화 효과가 아닌 일부 특수 효과들에 [통찰] 효과가 발동하던 오류가 수정되었습니다.","src":"2024.9!40"}]},{"name":"스킬 설명 개선","rows":[{"d":"2024.09.30","m":"하르퓨","a":"물/불/어둠","k":"죽음의 다트","t":"<변경 전> 날카로운 깃털을 날려 적에게 피해를 입히고, 2턴간 체력회복을 방해합니다.\n<변경 후> 날카로운 깃털을 날려 적 대상을 3회 공격하고, 2턴간 체력회복을 방해합니다.","src":"2024.9!43"},{"d":"2024.09.30","m":"조커","a":"바람/빛","k":"깜짝상자","t":"<변경 전> 깜짝 상자로 모든 적에게 피해를 주고, 기절, 빗맞음 발생 확률 증가, 공격 속도 감소 중 하나를 무작위로 겁니다.\n<변경 후> 깜짝 상자로 모든 적에게 피해를 주고, 1턴간 기절, 2턴 간 빗맞음 발생 확률 증가, 3턴 간 공격 속도 감소 중 하나를 무작위로 겁니다.","src":"2024.9!44"},{"d":"2024.09.30","m":"조커","a":"바람","k":"절단마술","t":"<변경 전> 수많은 카드를 날려 모든 적에게 방어를 무시하는 피해를 가합니다.\n<변경 후> 수많은 카드를 날려 모든 적에게 방어를 무시하는 피해를 3회 가합니다.","src":"2024.9!45"}]}]}],"key":"2024.09"},{"id":"2024.7","state":"hidden","groups":[{"title":"2024년 7월 밸런스 패치","sections":[{"name":"","rows":[{"d":"2024.07.24","m":"신수승(각성)","a":"물","k":"파쇄격","t":"기절 확률이 30% → 15% 으로 변경됩니다.","src":"2024.7!4"},{"d":"2024.07.24","m":"대왕 도깨비","a":"바람","k":"패기만만(패시브)","t":"자신의 체력 상황이 좋을수록 받는 피해 감소량이 최대 50% →  30% 으로 변경됩니다.","src":"2024.7!5"},{"d":"2024.07.24","m":"이프리트","a":"불","k":"태고의 힘(패시브)","t":"약화 효과가 없는 적에게 자신이 받는 피해 감소 효과가 20% → 30% 으로 변경됩니다.","src":"2024.7!6"},{"d":"2024.07.24","m":"오라클","a":"어둠","k":"치명적 오류","t":"【효과 추가】 \"1턴간 적 전체 기절\" 효과가 추가됩니다.\n(기존) 적에게 강화 효과가 있을 경우, 제거하고 1턴간 반드시 기절 → (변경) 1턴간 적 전체 기절 효과 부여 후, 추가로 강화 효과가 있는 적에게는 강화 효과를 제거하고 1턴간 반드시 기절로 변경됩니다.","src":"2024.7!7"},{"d":"2024.07.24","m":"손오공","a":"물","k":"분신격","t":"치명타 발생 시, 적의 강화 효과를 1개씩 제거하고 15% 확률로 1턴간 기절\n→ \"조건 없이\" 적의 강화 효과를 1개씩 제거하고 15% 확률로 1턴간 기절 효과가 적용되도록 변경됩니다.","src":"2024.7!8"},{"d":"2024.07.24","m":"손오공","a":"어둠","k":"먹구름 소환","t":"(1타)적 전체 2턴간 방어력 약화 (2타)75% 확률로 적 전체 1턴간 기절\n→ (1~2타) \"모든 공격에서\" 적 전체에게 2턴간 방어력 약화와, 75%확률로 1턴간 기절 효과가 적용되도록 변경됩니다.","src":"2024.7!9"},{"d":"2024.07.24","m":"바이슨 \n슬레이어","a":"물","k":"마인(패시브)\n전장의 파괴자(패시브)","t":"【패시브 발동 효과 변경] \n아군이 적에게 공격을 받을 때, 적의 파괴된 체력에 비례하여 빗맞음 발생 확률 증가 \n→ 아군이 적을 공격할 때, 적의 파괴된 체력에 비례하여 가하는 피해량이 증가하도록 변경됩니다.","src":"2024.7!10"},{"d":"2024.07.24","m":"해커","a":"물","k":"제로 데이 공격","t":"【효과 추가】 선택한 적 대상을 제외한 나머지 적의 공격 게이지를 20%씩 감소시킵니다.","src":"2024.7!11"},{"d":"2024.07.24","m":"해커","a":"물/빛","k":"크래킹","t":"공격 게이지 흡수량이 30% → 35% 으로 변경됩니다.","src":"2024.7!12"},{"d":"2024.07.24","m":"해커","a":"빛","k":"해커의 이중성","t":"【효과 추가】 적 전체 \"2턴간 공격 속도 감소\" 효과가 추가됩니다.","src":"2024.7!13"},{"d":"2024.07.24","m":"퓨어바닐라 쿠키\n푸딩 공주","a":"바람","k":"온화한 결의(패시브)\n달콤살벌한 맛(패시브)","t":"체력 상황이 가장 나쁜 아군의 약화 효과 1개 제거 → 2개가 제거되도록 변경됩니다.\n(약화 효과 제거 후 대상 실드 부여)","src":"2024.7!14"},{"d":"2024.07.24","m":"데빌 메이든","a":"어둠","k":"계약 : 지옥의 군주","t":"최대 쿨타임 1턴 감소 (7턴 → 6턴)\n【효과 추가】 지옥의 군주의 체력 0이 되어 사라지고, 데빌 메이든이 다시 등장할 때 : \n다시 등장한 데빌 메이든이 \"즉시 턴을 획득\"하도록 효과가 추가됩니다.","src":"2024.7!15"},{"d":"2024.07.24","m":"바예크\n사막 전사","a":"전속성","k":"올려베기\n도약 베기","t":"공격력 비례 피해 → 자신의 공격력 및 최대 체력에 따라 위력이 증가하는 피해로 변경됩니다.","src":"2024.7!16"},{"d":"2024.07.24","m":"사막 여왕","a":"바람","k":"미뤄진 약속","t":"【효과 추가】 선택한 적 대상에게 \"1턴간 약화 효과 해제 불가\"효과가 추가됩니다.","src":"2024.7!17"},{"d":"2024.07.24","m":"웨폰마스터","a":"빛","k":"마무리 일격(패시브)","t":"【패시브 발동 효과 변경】\n추가 공격에서 적 대상의 체력이 30% 이하일 때, 죽음을 거부하는 효과를 무시하는 피해\n→ 추가 공격에서 조건 없이 적 대상의 죽음을 거부하는 효과를 무시하는 피해가 적용되며, 체력이 30% 이하인 적 대상에게는 피해량이 20% 증가되도록 변경됩니다.","src":"2024.7!18"},{"d":"2024.07.24","m":"피닉스","a":"빛","k":"정화의 불꽃","t":"【효과 추가】 공격 후 모든 아군의 공격 게이지가 15%씩 증가됩니다.","src":"2024.7!19"},{"d":"2024.07.24","m":"피닉스","a":"어둠","k":"영혼의 불길(패시브)","t":"【패시브 발동 효과 변경】 \n자신의 턴에서 적을 죽이면 전투중 부활 불가 → 자신에 턴에서 공격한 적 대상의 패시브 스킬이 발동하지 않는 효과로 변경됩니다. (보스는 제외)\n\n(수정) \n【패시브 발동 효과 변경】 \n자신의 턴에서 적을 죽이면 전투중 부활 불가\n-> 자신의 턴에서 보스를 제외한 적 공격 시 모든 적의 패시브 스킬이 발동하지 않는 효과로 변경됩니다.\n예를 들어, 상대 진영에 물속성 마도사가 영혼석이 있는 상태에서 마도사가 아닌 다른 대상을 죽여도 대상이 부활하지 <script>
(function(){
const ATTRS=['물','불','바람','빛','어둠'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
const tabsById={};D.tabs.forEach(t=>{tabsById[t.key]=t;t.n=t.groups.reduce((a,g)=>a+g.sections.reduce((b,s)=>b+s.rows.length,0),0)});
const total=D.tabs.reduce((a,t)=>a+t.n,0);
const label=k=>{const[y,m]=k.split('.');return y+'년 '+(+m)+'월'};

/* 마스트 메타 */
const keys=D.tabs.map(t=>t.key).sort();
$('#mPeriod').innerHTML='<b>'+keys[0]+'</b> – <b>'+keys[keys.length-1]+'</b>';
$('#mTabs').innerHTML='<b>'+D.tabs.length+'</b>회';
$('#mRows').innerHTML='<b>'+total.toLocaleString()+'</b>건';

/* 평탄화: 검색용 행 */
const ALL=[];
D.tabs.forEach(t=>t.groups.forEach(g=>g.sections.forEach(s=>s.rows.forEach(r=>{
  ALL.push({r,tab:t.key,sec:s.name||'',nm:norm(r.m),set:attrSet(r.a)});
}))));
function attrSet(a){
  const out=new Set();
  String(a==null?'':a).split(/[\/\n]/).forEach(x=>{
    x=x.trim();
    if(ATTRS.includes(x))out.add(x);
    else if(x==='전속성'||x==='공통')ATTRS.forEach(y=>out.add(y));
  });
  return out;
}

/* 사이드 */
function renderSide(){
  let h='<div class="sh">월별 패치 아카이브</div>';
  let yr='';
  D.tabs.forEach(t=>{
    const y=t.key.slice(0,4);
    if(y!==yr){yr=y;h+='<div class="yr">'+y+'</div>'}
    h+='<button class="nav" data-r="'+t.key+'"><span>'+(+t.key.slice(5))+'월 패치</span><span class="c">'+t.n+'</span></button>';
  });
  $('#side').innerHTML=h;
  $('#side').addEventListener('click',e=>{
    const b=e.target.closest('.nav');if(b)go(b.dataset.r);
  });
  $('#archCnt').textContent=D.tabs.length;
}

/* 렌더 공통 */
function attrHtml(a){
  if(a==null||a==='')return '<span class="none">—</span>';
  const raw=String(a);
  if(raw.trim()==='-')return '<span class="at 전체" title="원본: -">전체 적용</span>';
  const toks=raw.split(/[\/\n]/).map(x=>x.trim()).filter(Boolean);
  return toks.map(x=>{
    if(ATTRS.includes(x))return '<span class="at '+x+'">'+x+'</span>';
    if(x==='전속성')return '<span class="at 전속성">전속성</span>';
    if(x==='공통')return '<span class="at 전속성" title="원본: 공통">전속성</span>';
    return '<span class="at etc">'+esc(x)+'</span>';
  }).join('');
}
function hl(text,terms){
  let t=esc(text);
  if(!terms||!terms.length)return t;
  terms=terms.filter(Boolean).sort((a,b)=>b.length-a.length).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!terms.length)return t;
  return t.replace(new RegExp('('+terms.join('|')+')','gi'),'<mark>$1</mark>');
}
function monHtml(m,terms){
  const L=String(m).split('\n');
  return '<div class="mn">'+hl(L[0],terms)+L.slice(1).map(x=>'<span class="l2">'+hl(x,terms)+'</span>').join('')+'</div>';
}
function skillHtml(k){
  if(k==null||String(k).trim()===''||String(k).trim()==='-')return '<div class="sk"><span class="none">—</span></div>';
  return '<div class="sk">'+String(k).split('\n').map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>';
}
function textHtml(t){
  if(t==null)return '<div class="tx"><span class="none">—</span></div>';
  let s=esc(t);
  s=s.replace(/^(\s*)(\[[^\]\n]{1,20}\]|【[^】\n]{1,20}】)/,(m,sp,g)=>sp+'<span class="tag">'+g.slice(1,-1)+'</span>');
  s=s.replace(/→/g,'<span class="ar">→</span>');
  return '<div class="tx">'+s+'</div>';
}
function rowHtml(r,o){
  const dt=o.date?'<div class="cell dt">'+esc(r.d)+(o.tab?'<a href="#/'+o.tab+'" data-go="'+o.tab+'">'+label(o.tab)+(o.sec?' · '+esc(o.sec):'')+'</a>':'')+'</div>':'';
  return '<div class="row '+(o.date?'has-date':'no-date')+'">'+dt+
    '<div class="cell">'+monHtml(r.m,o.terms)+'</div>'+
    '<div class="cell"><div class="attrs">'+attrHtml(r.a)+'</div></div>'+
    '<div class="cell">'+skillHtml(r.k)+'</div>'+
    '<div class="cell">'+textHtml(r.t)+'</div></div>';
}
function headHtml(date){
  return '<div class="row rh '+(date?'has-date':'no-date')+'">'+(date?'<div>일정</div>':'')+'<div>몬스터</div><div>속성</div><div>변경 사항</div><div>상세 내용</div></div>';
}

/* 검색 */
let attr='전체';
function renderPills(){
  $('#attrPills').innerHTML=['전체'].concat(ATTRS).map(a=>'<button class="pill'+(a===attr?' on':'')+'" data-a="'+a+'">'+a+'</button>').join('');
}
function counterparts(q){
  const nq=norm(q);if(!nq)return[];
  const out=new Set();
  D.collab.forEach(([c,d])=>{
    if(norm(c).includes(nq))out.add(d);
    if(norm(d).includes(nq))out.add(c);
  });
  return [...out];
}
function search(){
  const q=$('#q').value.trim();
  const box=$('#results'),note=$('#resNote'),hint=$('#hint');
  if(!q){
    hint.innerHTML='';note.textContent='';
    box.innerHTML='<div class="empty"><b>몬스터명</b>을 입력하면 변경 이력이 표시됩니다.</div>';
    return;
  }
  const cp=counterparts(q);
  const terms=[q].concat(cp);
  const nterms=terms.map(norm);
  hint.innerHTML=cp.length?'콜라보명 · 원본명 함께 검색: <b>'+cp.slice(0,5).map(esc).join(', ')+'</b>'+(cp.length>5?' 외 '+(cp.length-5)+'개':''):'';
  const res=ALL.filter(x=>nterms.some(t=>x.nm.includes(t))&&(attr==='전체'||x.set.has(attr)));
  note.textContent=res.length+'건'+(attr!=='전체'?' · 속성 '+attr+'(전속성 포함)':'');
  if(!res.length){
    box.innerHTML='<div class="empty">'+(attr!=='전체'?'<b>'+attr+'</b> 속성에서 ':'')+'<b>'+esc(q)+'</b>에 해당하는 변경 이력이 없습니다.</div>';
    return;
  }
  const lim=400;
  box.innerHTML='<div class="rows">'+headHtml(true)+res.slice(0,lim).map(x=>rowHtml(x.r,{date:true,tab:x.tab,sec:x.sec,terms})).join('')+'</div>'+
    (res.length>lim?'<div class="empty">상위 '+lim+'건만 표시했습니다. 조건을 좁혀 주세요.</div>':'');
}

/* 월별 탭 */
function renderTab(key){
  const t=tabsById[key];
  const multi=t.groups.length>1;
  const dates=[...new Set(t.groups.flatMap(g=>g.sections.flatMap(s=>s.rows.map(r=>r.d))))].sort();
  const showDate=dates.length>1;
  const secs=[];t.groups.forEach((g,gi)=>g.sections.forEach((s,si)=>secs.push({g,gi,s,id:'sec-'+gi+'-'+si})));
  const title=multi?label(key)+' 밸런스 패치':(t.groups[0].title||label(key)+' 밸런스 패치');
  let h='<div class="rhead"><div class="rtitle"><h2>'+esc(title)+'</h2><span class="rmeta"><b>'+t.n+'</b>건 · '+dates.map(esc).join(', ')+'</span></div></div>';
  h+='<div class="secpills">'+secs.map(x=>'<button class="pill" data-s="'+x.id+'">'+esc(x.s.name||'변경 내역')+'<span class="c">'+x.s.rows.length+'</span></button>').join('')+'</div>';
  let lastG=-1;
  h+='<div class="secs">';
  secs.forEach((x,i)=>{
    if(multi&&x.gi!==lastG&&x.g.title){h+='</div><div class="gband">'+esc(x.g.title)+'</div><div class="secs">'}
    lastG=x.gi;
    h+='<section class="sec" id="'+x.id+'"><div class="sechead"><span class="mark"></span><h3>'+esc(x.s.name||'변경 내역')+'</h3><span class="secmeta">'+x.s.rows.length+'건</span></div>'+
      '<div class="rows">'+headHtml(showDate)+x.s.rows.map(r=>rowHtml(r,{date:showDate})).join('')+'</div></section>';
  });
  h+='</div>';
  $('#v-tab').innerHTML=h;
}

/* 라우팅 */
function go(r){location.hash='#/'+r}
function setArch(open){
  $('#side').hidden=!open;
  $('#layout').classList.toggle('open',open);
  $('#btnArch').classList.toggle('open',open);
  $('#btnArch').setAttribute('aria-expanded',open);
}
let routed=false;
function route(){
  let r=(location.hash||'').replace(/^#\/?/,'')||'search';
  if(r!=='search'&&!tabsById[r])r='search';
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  $('#btnSearch').classList.toggle('on',r==='search');
  if(r!=='search')setArch(innerWidth>900||!routed);
  routed=true;
  $('#v-search').classList.toggle('on',r==='search');
  $('#v-tab').classList.toggle('on',r!=='search');
  if(r!=='search')renderTab(r);
  window.scrollTo(0,0);
}

$('#attrPills').addEventListener('click',e=>{
  const b=e.target.closest('.pill');if(!b)return;
  attr=b.dataset.a;renderPills();search();
});
$('#q').addEventListener('input',search);
$('#btnSearch').addEventListener('click',()=>{go('search');setTimeout(()=>$('#q').focus(),0)});
$('#btnArch').addEventListener('click',()=>setArch($('#side').hidden));
$('#v-tab').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');
  if(b){const el=document.getElementById(b.dataset.s);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-go]');
  if(a){e.preventDefault();go(a.dataset.go)}
});
window.addEventListener('hashchange',route);

renderSide();renderPills();search();route();
})();
</script>
</body>
